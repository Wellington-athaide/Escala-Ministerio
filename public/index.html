<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Escala da Mídia</title>
<style>
  :root { --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --line:#e2e8f0; --card:#ffffff; --accent:#2563eb; --bad:#dc2626; --ok:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0b1120; --fg:#e2e8f0; --muted:#94a3b8; --line:#1e293b; --card:#111827; --accent:#60a5fa; --bad:#f87171; --ok:#4ade80; }
  }
  :root[data-theme="dark"] { --bg:#0b1120; --fg:#e2e8f0; --muted:#94a3b8; --line:#1e293b; --card:#111827; --accent:#60a5fa; --bad:#f87171; --ok:#4ade80; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  main { padding:16px 0; max-width:820px; margin:0 auto; }
  button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--bad); }
  button.active { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  input, select, textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); max-width:100%; }
  textarea { width:100%; }
  label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
  label.inline { flex-direction:row; align-items:center; color:var(--fg); font-size:15px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:12px; }
  .muted { color:var(--muted); font-size:13px; }
  .error { color:var(--bad); margin:8px 0; }
  .ok { color:var(--ok); margin:8px 0; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-top:12px; }
  .panel h3 { margin:0 0 6px; font-size:15px; }
  .panel ul { margin:4px 0 0; padding-left:18px; }
  pre.text { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; margin:0; font:13px/1.5 ui-monospace, monospace; max-height:60vh; overflow:auto; }
  .person { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  .person input { min-width:0; }
  @media (max-width: 600px) { .person > input { flex:1 1 100%; } }
</style>
</head>
<body>
<header>
  <h1>Escala da Mídia</h1>
  <nav id="nav">
    <button data-tab="generator">Gerador</button>
    <button data-tab="events">Eventos</button>
    <button data-tab="members">Membros</button>
  </nav>
</header>
<main id="view"></main>
<!--BUNDLE-->
<script>
const $ = (sel) => document.querySelector(sel);
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayIso = () => new Date().toISOString().slice(0, 10);
const addMonths = (iso, n) => { const d = new Date(`${iso}T00:00:00Z`); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); };
const shortDate = (iso) => `${iso.slice(8)}/${iso.slice(5, 7)}`;
const splitList = (value) => value.split(',').map((s) => s.trim()).filter(Boolean);
const norm = (value) => String(value).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

const state = { people: [], tab: 'generator', flash: null };

async function api(method, url, body) {
  if (window.localApi) return window.localApi(method, url, body);
  const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `erro ${res.status}`);
  return data;
}

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  render();
}

async function render() {
  state.people = await api('GET', '/api/people');
  const view = $('#view');
  if (state.tab === 'members') members(view);
  else if (state.tab === 'events') events(view);
  else generator(view);
}

// ---------- Gerador ----------

const WEEKDAY_NUMBER = { domingo: 0, segunda: 1, 'terça': 2, terca: 2, quarta: 3, quinta: 4, sexta: 5, 'sábado': 6, sabado: 6 };

// Uma pessoa por função: "Câmera, Reels" ou uma função por linha.
function parseRoles(source) {
  return source.split(/[,\n]/).map((part) => ({ role: part.trim() })).filter((r) => r.role);
}

// Uma linha por culto: o dia da semana, o nome do culto e as funções.
// As funções vêm depois de "|" ou do último ":" da linha. Exemplos:
//   domingo Culto de Domingo | Câmera, Reels, Projeção
//   Quinta: Culto de Quinta: Câmera, Projeção
const WEEKDAY_RE = /(domingo|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado)/i;
const LEADING_WEEKDAY_RE = /^\s*(domingo|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado)(?:[- ]feira)?\b,?/i;

function parseTemplates(source) {
  return source.split('\n').map((line) => line.trim()).filter(Boolean).map((line, index) => {
    const fail = (message) => {
      throw new Error(`linha ${index + 1}: ${message}`);
    };
    const weekdayMatch = line.match(WEEKDAY_RE);
    if (!weekdayMatch) fail('não achei o dia da semana (domingo, quinta…)');

    const pipe = line.indexOf('|');
    const cut = pipe >= 0 ? pipe : line.lastIndexOf(':');
    if (cut < 0) fail('não achei as funções (escreva depois de "|" ou ":")');
    const roles = parseRoles(line.slice(cut + 1));
    if (!roles.length) fail('não achei as funções (escreva depois de "|" ou ":")');

    const title = line
      .slice(0, cut)
      .replace(LEADING_WEEKDAY_RE, ' ')
      .replace(/[|:·,\-–]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim() || 'Culto';
    return { weekday: WEEKDAY_NUMBER[weekdayMatch[1].toLowerCase()], title, roles };
  });
}

function generator(view) {
  const mode = view.dataset.mode || 'mes';
  view.innerHTML = `
    <div class="row">
      <label class="inline"><input type="radio" name="g-mode" value="culto" ${mode === 'culto' ? 'checked' : ''}>&nbsp;Culto específico</label>
      <label class="inline"><input type="radio" name="g-mode" value="mes" ${mode === 'mes' ? 'checked' : ''}>&nbsp;Mês inteiro</label>
    </div>
    <div id="g-form"></div>
    <label style="margin-top:12px">Escalas dos outros ministérios (cole aqui, uma ou várias)
      <textarea id="g-external" rows="8" placeholder="Louvor · Domingo, 01/11&#10;Renata&#10;Arthur&#10;&#10;Recepção · Quinta, 05/11&#10;Paulo"></textarea>
    </label>
    <p class="muted">As pessoas citadas em cada bloco ficam indisponíveis naquele dia. Se o bloco tiver horário, vale só nele. Pode ser o nome completo, o primeiro nome (se for único no cadastro) ou um apelido.</p>
    <div class="row"><button class="primary" id="g-run">Gerar sem conflitos</button></div>
    <div id="g-result"></div>`;
  view.querySelectorAll('[name="g-mode"]').forEach((radio) => {
    radio.onchange = () => { view.dataset.mode = radio.value; generator(view); };
  });
  if (mode === 'culto') singleForm(); else monthForm();
  $('#g-run').onclick = run;
}

function singleForm() {
  $('#g-form').innerHTML = `
    <div class="row">
      <label>Nome do culto <input id="g-title" value="Culto de Domingo"></label>
      <label>Data <input type="date" id="g-date" value="${addDays(todayIso(), 7)}"></label>
    </div>
    <label>Funções (uma pessoa por função, separe por vírgula)
      <textarea id="g-roles">Câmera, Reels, Projeção</textarea></label>`;
}

function monthForm() {
  $('#g-form').innerHTML = `
    <div class="row"><label>Mês <input type="month" id="g-month" value="${addMonths(todayIso(), 1)}"></label></div>
    <label>Cultos recorrentes (um por linha)
      <textarea id="g-templates" rows="3">domingo Culto de Domingo | Câmera, Reels, Projeção
quinta Culto de Quinta | Câmera, Projeção</textarea></label>`;
}

function addDays(iso, n) { const d = new Date(`${iso}T00:00:00Z`); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

async function run() {
  const out = $('#g-result');
  out.innerHTML = '<p class="muted">Gerando…</p>';
  try {
    const externalText = $('#g-external').value;
    const isMonth = document.querySelector('[name="g-mode"]:checked').value === 'mes';
    const result = isMonth
      ? await api('POST', '/api/generate-month', { month: $('#g-month').value, templates: parseTemplates($('#g-templates').value), externalText })
      : await api('POST', '/api/generate', {
          title: $('#g-title').value, date: $('#g-date').value,
          roles: parseRoles($('#g-roles').value), externalText,
        });
    showResult(result, isMonth);
  } catch (error) {
    out.innerHTML = `<p class="error">${esc(error.message)}</p>`;
  }
}

function showResult(result, isMonth) {
  const services = isMonth ? result.services : [result];
  const read = result.report.filter((r) => !r.ignored);
  const ignored = result.report.filter((r) => r.ignored);
  const withExclusions = services.filter((s) => s.excluded.length);
  const withGaps = services.filter((s) => s.unfilled.length);

  $('#g-result').innerHTML = `
    <div class="panel">
      <h3>Escalas lidas (${read.length})</h3>
      ${read.length ? `<ul>${read.map((r) => `<li>${shortDate(r.date)} · ${r.allDay ? 'dia inteiro' : `${r.start}–${r.end}${r.estimatedEnd ? ' (término estimado em 2h)' : ''}`} · ${esc(r.title)}: ${r.names.length ? esc(r.names.join(', ')) : '<span class="muted">nenhum da equipe</span>'}</li>`).join('')}</ul>` : '<p class="muted">Nenhum bloco lido. Confira se as datas foram coladas.</p>'}
      ${ignored.length ? `<h3 style="margin-top:10px">Ignoradas</h3><ul>${ignored.map((r) => `<li class="error">${esc(r.label)}: ${esc(r.ignored)}</li>`).join('')}</ul>` : ''}
    </div>
    ${withExclusions.length ? `<div class="panel"><h3>Não escalados por outro compromisso</h3><ul>${withExclusions.map((s) => s.excluded.map((e) => `<li>${shortDate(s.slot.date)} ${esc(s.title)}: ${esc(e.personName)} (${e.motivos.map((m) => `${esc(m.other.title)} ${m.other.start}–${m.other.end}`).join(', ')})</li>`).join('')).join('')}</ul></div>` : ''}
    ${withGaps.length ? `<div class="panel"><h3>Vagas sem pessoa</h3><ul>${withGaps.map((s) => s.unfilled.map((u) => `<li>${shortDate(s.slot.date)} ${esc(s.title)}: ${esc(u.role)} (faltam ${u.faltam})</li>`).join('')).join('')}</ul></div>` : ''}
    <div class="panel">
      <h3>Texto para o WhatsApp</h3>
      <pre class="text" id="g-text">${esc(result.markdown)}</pre>
      <div class="row" style="margin-top:10px"><button class="primary" id="g-copy">Copiar texto</button><span id="g-msg" class="muted"></span></div>
    </div>`;

  $('#g-copy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(result.markdown);
      $('#g-msg').innerHTML = '<span class="ok">Texto copiado.</span>';
    } catch {
      const range = document.createRange();
      range.selectNodeContents($('#g-text'));
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      $('#g-msg').textContent = 'Não consegui copiar sozinho. O texto está selecionado: use Ctrl+C.';
    }
  };
}

// ---------- Eventos ----------

const EVENT_WEEKDAYS = [
  { value: 5, label: 'Sexta' },
  { value: 6, label: 'Sábado' },
  { value: 0, label: 'Domingo' },
];

// Todas as datas do mês que caem nos dias da semana marcados (0 = domingo).
function monthDates(month, weekdays) {
  const [year, monthNumber] = month.split('-').map(Number);
  const lastDay = new Date(Date.UTC(year, monthNumber, 0)).getUTCDate();
  const dates = [];
  for (let day = 1; day <= lastDay; day++) {
    const date = new Date(Date.UTC(year, monthNumber - 1, day));
    if (weekdays.includes(date.getUTCDay())) dates.push(date.toISOString().slice(0, 10));
  }
  return dates;
}

const weekdayLabel = (iso) => EVENT_WEEKDAYS.find((w) => w.value === new Date(`${iso}T00:00:00Z`).getUTCDay())?.label ?? '';

function events(view) {
  view.innerHTML = `
    <div class="row">
      <label>Nome do evento <input id="e-name" value="Evento" style="min-width:220px"></label>
      <label>Mês <input type="month" id="e-month" value="${addMonths(todayIso(), 1)}"></label>
    </div>
    <div class="row">
      ${EVENT_WEEKDAYS.map((w) => `<label class="inline"><input type="checkbox" class="e-weekday" value="${w.value}" checked>&nbsp;${w.label}</label>`).join('')}
    </div>
    <p class="muted">Desmarque as datas que não terão evento.</p>
    <div id="e-dates" class="row" style="flex-direction:column;align-items:flex-start;gap:6px"></div>
    <label style="margin-top:12px">Funções (uma pessoa por função, separe por vírgula)
      <textarea id="e-roles">Câmera, Reels, Projeção</textarea></label>
    <label style="margin-top:12px">Escalas dos outros ministérios (cole aqui, uma ou várias)
      <textarea id="e-external" rows="6"></textarea></label>
    <div class="row" style="margin-top:10px"><button class="primary" id="e-run">Gerar evento</button></div>
    <div id="g-result"></div>`;

  const renderDates = () => {
    const weekdays = [...view.querySelectorAll('.e-weekday:checked')].map((c) => Number(c.value));
    const dates = weekdays.length ? monthDates($('#e-month').value, weekdays) : [];
    $('#e-dates').innerHTML = dates.length
      ? dates.map((d) => `<label class="inline"><input type="checkbox" class="e-date" value="${d}" checked>&nbsp;${weekdayLabel(d)} ${shortDate(d)}</label>`).join('')
      : '<span class="muted">Nenhuma data com esses dias no mês.</span>';
  };
  view.querySelectorAll('.e-weekday').forEach((c) => { c.onchange = renderDates; });
  $('#e-month').onchange = renderDates;
  renderDates();

  $('#e-run').onclick = async () => {
    const out = $('#g-result');
    const dates = [...view.querySelectorAll('.e-date:checked')].map((c) => c.value);
    if (!dates.length) {
      out.innerHTML = '<p class="error">Escolha pelo menos uma data.</p>';
      return;
    }
    out.innerHTML = '<p class="muted">Gerando…</p>';
    try {
      const result = await api('POST', '/api/generate-events', {
        title: $('#e-name').value,
        dates,
        roles: parseRoles($('#e-roles').value),
        externalText: $('#e-external').value,
      });
      showResult(result, true);
    } catch (error) {
      out.innerHTML = `<p class="error">${esc(error.message)}</p>`;
    }
  };
}

// ---------- Membros ----------

const WEEK_LABELS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

const MEMBERS_TEXT = `Renata - Câmera, Reels
Duda - Câmera, Reels
Arthur - Câmera, Reels
Kaique - Câmera
Maely - Câmera, Reels
Myca - Câmera, Reels
Paulo - Projeção
Jakeline - Projeção
Eu - tudo`;

function members(view) {
  view.innerHTML = `
    <p class="muted">Cada pessoa só é escalada nas funções que ela faz. "tudo" vale para qualquer função, e a pessoa entra como reserva. Os dias marcados limitam quando ela pode servir. As observações são só para você: o gerador segue funções e dias.</p>
    <label>Um por linha: <code>Nome - função, função</code>. Quem já existe é atualizado.
      <textarea id="p-bulk" rows="9">${esc(MEMBERS_TEXT)}</textarea></label>
    <div class="row" style="margin-top:8px"><button class="primary" id="p-bulk-run">Cadastrar membros</button></div>

    <h3>Pessoas cadastradas</h3>
    <form id="p-new" class="row"><input name="name" placeholder="Nome" required><input name="skills" placeholder="Funções (ex.: Câmera, Reels)"><button class="primary">Adicionar</button></form>
    ${state.people.map((p) => `<div class="panel" data-person="${p.id}">
      <input value="${esc(p.name)}" data-field="name" style="width:100%;font-weight:600">
      <label style="margin-top:8px">Funções que faz
        <input value="${esc((p.skills ?? []).join(', '))}" data-field="skills" placeholder="Câmera, Reels"></label>
      <div style="margin-top:8px"><span class="muted">Só pode servir nestes dias (sem marcar = qualquer dia)</span>
        <div class="row" style="margin:4px 0 0">${WEEK_LABELS.map((w, i) => `<label class="inline"><input type="checkbox" data-day="${i}" ${(p.weekdays ?? []).includes(i) ? 'checked' : ''}>&nbsp;${w}</label>`).join('')}</div></div>
      <label style="margin-top:8px">Observações
        <textarea data-field="observations" rows="2" placeholder="Ex.: só câmera, não vai ao datashow">${esc(p.observations ?? '')}</textarea></label>
      <div class="row" style="margin:8px 0 0"><button data-save-person>Salvar</button><button class="danger" data-del-person>Remover</button></div></div>`).join('') || '<p class="muted">Nenhuma pessoa cadastrada.</p>'}
    <p id="r-msg">${state.flash ?? ''}</p>`;
  state.flash = null;

  const report = (promise) => promise.then(() => setTab('members')).catch((error) => {
    $('#r-msg').innerHTML = `<span class="error">${esc(error.message)}</span>`;
  });
  view.querySelector('#p-new').onsubmit = (event) => {
    event.preventDefault();
    const f = event.target;
    report(api('POST', '/api/people', { name: f.name.value, skills: splitList(f.skills.value) }));
  };
  $('#p-bulk-run').onclick = async () => {
    try {
      const current = await api('GET', '/api/people');
      let created = 0;
      let updated = 0;
      for (const line of $('#p-bulk').value.split('\n').map((l) => l.trim()).filter(Boolean)) {
        const [name, ...rest] = line.split(' - ');
        const skills = splitList(rest.join(' - '));
        const existing = current.find((p) => norm(p.name) === norm(name));
        if (existing) {
          await api('PUT', `/api/people/${existing.id}`, { name: existing.name, aliases: existing.aliases ?? [], skills, weekdays: existing.weekdays ?? [], observations: existing.observations ?? '' });
          updated++;
        } else {
          current.push(await api('POST', '/api/people', { name: name.trim(), skills }));
          created++;
        }
      }
      state.flash = `<span class="ok">${created} cadastrada(s), ${updated} atualizada(s).</span>`;
      setTab('members');
    } catch (error) {
      $('#r-msg').innerHTML = `<span class="error">${esc(error.message)}</span>`;
    }
  };
  view.onclick = (event) => {
    const t = event.target;
    const row = t.closest('[data-person]');
    if (!row) return;
    if (t.hasAttribute('data-save-person')) {
      const person = state.people.find((p) => p.id === row.dataset.person);
      report(api('PUT', `/api/people/${row.dataset.person}`, {
        name: row.querySelector('[data-field="name"]').value,
        aliases: person?.aliases ?? [],
        skills: splitList(row.querySelector('[data-field="skills"]').value),
        weekdays: [...row.querySelectorAll('[data-day]:checked')].map((c) => Number(c.dataset.day)),
        observations: row.querySelector('[data-field="observations"]').value.trim(),
      }));
    }
    if (t.hasAttribute('data-del-person') && confirm('Remover pessoa?')) report(api('DELETE', `/api/people/${row.dataset.person}`));
  };
}

document.getElementById('nav').addEventListener('click', (event) => {
  if (event.target.dataset.tab) setTab(event.target.dataset.tab);
});

setTab('generator');
</script>
</body>
</html>
